<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shmarket</title>
  <link rel="icon" href="shmarket.jpeg">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; }
    main { max-width: 36rem; margin: 12vh auto; padding: 0 1.5rem; }
    h1 { font-size: clamp(2.5rem, 10vw, 4.5rem); margin: 0; letter-spacing: -.04em; }
    p { line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.75rem; }
    nav a { border: 1px solid currentColor; border-radius: .5rem; padding: .65rem .9rem; }
    .primary { background: #164d3e; color: #fff; border-color: #164d3e; text-decoration: none; }
    .icon { width: 5rem; height: 5rem; border-radius: 1.15rem; display: block; margin-bottom: 1rem; }
    #market-version { color: GrayText; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="shmarket.jpeg" alt="" width="80" height="80">
    <h1>shmarket</h1>
    <p>SuShuheng 分享的 Apple 应用</p>
    <p id="market-version" hidden></p>
    <nav aria-label="软件源">
      <a class="primary" href="sidestore://source?url=https%3A%2F%2Fsushuheng.github.io%2Fipa-apps%2Fsource.json">在 SideStore 中添加</a>
      <a href="source.json">软件源 JSON</a>
      <a href="https://github.com/SuShuheng/ipa-apps/releases">GitHub Releases</a>
    </nav>
  </main>
  <script>
    async function showMarketVersion() {
      const response = await fetch("source.json");
      if (!response.ok) return;
      const { marketVersion } = await response.json();
      if (!marketVersion) return;
      const label = document.querySelector("#market-version");
      label.textContent = `市场版本 ${marketVersion}`;
      label.hidden = false;
    }
    showMarketVersion().catch(() => {});
  </script>
</body>
</html>
